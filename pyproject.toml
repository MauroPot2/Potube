[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "potube"
version = "1.2.0"
description = "CLI per scaricare audio da YouTube e convertirlo in MP3 tramite yt-dlp"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Mauro Potestio" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.scripts]
potube = "potube.__main__:main"

[tool.setuptools.packages.find]
include = ["potube*"]
